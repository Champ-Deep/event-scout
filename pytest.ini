[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --ignore=tests/test_suite.py
markers =
    live: hits the live Railway deployment; requires LIVE_API_BASE and LIVE_API_KEY env vars
    slow: takes more than a few seconds
