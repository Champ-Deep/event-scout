<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>EventScout Admin Console</title>
    <!-- @openuidev/react-lang mounts a floating "OpenUI Inspect" button in development (over the page corner);
         this flag is its own "already mounted" marker, so setting it first keeps that widget off the console. -->
    <script>globalThis[Symbol.for('openui.devtools.autoMount')] = true;</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
