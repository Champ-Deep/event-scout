# Self-hosted production stack: Postgres + the API. Needs a .env next to this file with at least
# APP_API_KEY, JWT_SECRET, OPENROUTER_API_KEY, PUBLIC_BASE_URL and POSTGRES_PASSWORD (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eventscout
    volumes:
      - eventscout_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: event-scout:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # always the compose Postgres (a SQLite URL in .env would put data on the container's disk)
      DATABASE_URL: postgresql://eventscout:${POSTGRES_PASSWORD}@db:5432/eventscout
      DATABASE_PUBLIC_URL: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eventscout_postgres:
