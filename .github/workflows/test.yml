name: CI

on:
  push:
    branches: [master, main, cf/native]
  pull_request:
    branches: [master, main, "cf/**", "feature/**", "claude/**"]

jobs:
  python:
    name: Python tests (FastAPI archive app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: es_idem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # The in-process TestClient uses this key. Live tests skip
          # because LIVE_API_KEY is not set.
          APP_API_KEY: test-api-key
          # Empty so app.py doesn't try to talk to Gemini at import time.
          GEMINI_API_KEY: ""
          # tests/test_scan_idempotency.py and tests/test_admin_api.py need a local Postgres.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/es_idem_test
        run: pytest -m "not live" --cov=app --cov=database --cov-report=term-missing

  worker:
    name: Worker typecheck (Cloudflare, production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  web:
    name: Web tests and build (new UI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Docker image builds (FastAPI archive)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t event-scout:ci .

  gate:
    name: CI gate
    if: always()
    needs: [python, worker, web, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
